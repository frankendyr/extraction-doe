<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Visual - Extração de Decreto</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; background: #f5f7fa; color: #333; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #4a5568; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { background: #4299e1; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #3182ce; }
        button:disabled { background: #a0aec0; cursor: not-allowed; }
        
        #log-container { margin-top: 30px; }
        #logs { background: #1a202c; color: #a0aec0; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 14px; height: 300px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; }
        .log-line { margin: 2px 0; }
        .log-info { color: #63b3ed; }
        .log-error { color: #fc8181; }
        
        .results-container { display: flex; gap: 20px; margin-top: 30px; }
        .result-box { flex: 1; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
        .result-header { background: #edf2f7; padding: 12px 15px; font-weight: 600; color: #2d3748; border-bottom: 1px solid #e2e8f0; }
        .result-content { padding: 15px; font-family: monospace; font-size: 13px; white-space: pre-wrap; overflow-y: auto; height: 500px; background: #f8fafc; }
        
        .raw-content { color: #718096; }
        .formatted-content { color: #2d3748; font-weight: 500; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Laboratório de Extração</h1>
    <p>Simulador exato da esteira de produção para um único decreto. Nada é salvo no banco.</p>
    
    <div class="form-group">
        <label>URL do PDF do Diário Oficial</label>
        <input type="text" id="url" value="https://imagens.seplag.ce.gov.br/PDF/20201218/do20201218p01.pdf" placeholder="https://...">
    </div>
    
    <div class="form-group">
        <label>Número do Decreto (Ex: 33.856)</label>
        <input type="text" id="decreto" value="33.856" placeholder="Ex: 33.856">
    </div>
    
    <button id="btn-extrair" onclick="iniciarExtracao()">Extrair e Analisar</button>

    <div id="log-container">
        <label>Console da Esteira (Tempo Real)</label>
        <div id="logs"></div>
    </div>
    
    <div id="resultados" class="hidden">
        <h2 style="margin-top: 40px; color: #2c3e50;">Resultados Finais</h2>
        
        <!-- CORPO -->
        <div class="results-container">
            <div class="result-box">
                <div class="result-header">Corpo (Extração Bruta + Limpeza)</div>
                <div class="result-content raw-content" id="corpo-cru"></div>
            </div>
            <div class="result-box">
                <div class="result-header">Corpo (Formatado pela IA)</div>
                <div class="result-content formatted-content" id="corpo-formatado"></div>
            </div>
        </div>
        
        <!-- ANEXOS -->
        <div class="results-container">
            <div class="result-box">
                <div class="result-header">Anexos (Extração Bruta)</div>
                <div class="result-content raw-content" id="anexos-cru"></div>
            </div>
            <div class="result-box">
                <div class="result-header">Anexos (Formatado pela IA)</div>
                <div class="result-content formatted-content" id="anexos-formatado"></div>
            </div>
        </div>
    </div>
</div>

<script>
    async function iniciarExtracao() {
        const url = document.getElementById('url').value.trim();
        const decreto = document.getElementById('decreto').value.trim();
        
        if (!url || !decreto) {
            alert('Preencha a URL e o Decreto!');
            return;
        }

        const btn = document.getElementById('btn-extrair');
        const logsDiv = document.getElementById('logs');
        const resultadosDiv = document.getElementById('resultados');
        
        btn.disabled = true;
        btn.innerText = 'Processando...';
        logsDiv.innerHTML = '';
        resultadosDiv.classList.add('hidden');
        
        try {
            const response = await fetch('http://127.0.0.1:8000/teste-decreto-visual', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    url_do_diario: url, 
                    numero_do_decreto: decreto 
                })
            });

            if (!response.body) throw new Error('ReadableStream não suportado');

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let done = false;
            let buffer = "";

            while (!done) {
                const { value, done: readerDone } = await reader.read();
                done = readerDone;
                
                if (value) {
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    
                    buffer = lines.pop(); // Mantém no buffer se a última linha não estiver completa
                    
                    for (const line of lines) {
                        if (!line.trim()) continue;
                        
                        try {
                            const data = JSON.parse(line);
                            
                            if (data.status === 'log') {
                                const p = document.createElement('div');
                                p.className = 'log-line log-info';
                                p.innerText = `> ${data.mensagem}`;
                                logsDiv.appendChild(p);
                                logsDiv.scrollTop = logsDiv.scrollHeight;
                            } 
                            else if (data.status === 'error') {
                                const p = document.createElement('div');
                                p.className = 'log-line log-error';
                                p.innerText = `[ERRO] ${data.mensagem}`;
                                logsDiv.appendChild(p);
                                logsDiv.scrollTop = logsDiv.scrollHeight;
                                btn.disabled = false;
                                btn.innerText = 'Extrair e Analisar';
                            }
                            else if (data.status === 'done') {
                                const p = document.createElement('div');
                                p.className = 'log-line log-info';
                                p.innerText = `\n✅ EXTRAÇÃO CONCLUÍDA COM SUCESSO!`;
                                p.style.color = '#48bb78';
                                p.style.fontWeight = 'bold';
                                logsDiv.appendChild(p);
                                logsDiv.scrollTop = logsDiv.scrollHeight;
                                
                                // Mostrar Resultados
                                document.getElementById('corpo-cru').innerText = data.resultados.corpo_cru || 'Vazio';
                                document.getElementById('corpo-formatado').innerText = data.resultados.corpo_formatado || 'Vazio';
                                document.getElementById('anexos-cru').innerText = data.resultados.anexos_cru || 'Vazio';
                                document.getElementById('anexos-formatado').innerText = data.resultados.anexos_formatados || 'Vazio';
                                
                                resultadosDiv.classList.remove('hidden');
                                
                                btn.disabled = false;
                                btn.innerText = 'Extrair e Analisar';
                            }
                        } catch (e) {
                            console.error("Erro no parse JSON", line, e);
                        }
                    }
                }
            }
        } catch (error) {
            console.error(error);
            logsDiv.innerHTML += `<div class="log-line log-error">[ERRO DE CONEXÃO] ${error.message}</div>`;
            btn.disabled = false;
            btn.innerText = 'Extrair e Analisar';
        }
    }
</script>

</body>
</html>
